name: Build Android test app
# Manual: Actions tab → Build Android test app → Run workflow. Needs one repository secret: EXPO_TOKEN (expo.dev → User settings → Advanced → Access tokens).
on:
  workflow_dispatch:
    inputs:
      platform: { description: "android, ios or all", default: "android", required: true }
      profile: { description: "preview (install file) or testflight", default: "preview", required: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: ${{ secrets.EXPO_TOKEN }} }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test -- --ci
      - name: Build
        run: eas build --platform ${{ github.event.inputs.platform || 'android' }} --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive --no-wait
